<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vue App - Products</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div id="app">
        <!-- Consistent Navbar -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
            <div class="container-fluid">
                <a class="navbar-brand fw-bold" href="index.html">VueApp</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                        <li class="nav-item"><a class="nav-link active" href="products.html">Products</a></li>
                        <li class="nav-item"><a class="nav-link" href="sales.html">Sales</a></li>
                        <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
                        <li class="nav-item"><a class="nav-link" href="register.html">Register</a></li>
                    </ul>
                </div>
            </div>
        </nav>

        <div class="container">
            <h2 class="mb-4">Product Management</h2>

            <!-- Add Product Form -->
            <div class="card mb-4">
                <div class="card-body">
                    <h5 class="card-title">Add New Product</h5>
                    <form @submit.prevent="addProduct">
                        <div class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label">Product Name</label>
                                <input type="text" v-model="newProduct.name" class="form-control" required>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Price ($)</label>
                                <input type="number" v-model="newProduct.price" class="form-control" step="0.01" required>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Stock Quantity</label>
                                <input type="number" v-model="newProduct.stock" class="form-control" required>
                            </div>
                            <div class="col-md-2 d-flex align-items-end">
                                <button type="submit" class="btn btn-success w-100">Add</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Products Table -->
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Inventory</h5>
                    <div class="table-responsive">
                        <table class="table table-bordered">
                            <thead class="table-light">
                                <tr>
                                    <th>ID</th>
                                    <th>Name</th>
                                    <th>Price</th>
                                    <th>Stock</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr v-for="product in products" :key="product.id">
                                    <td>{{ product.id }}</td>
                                    <td>{{ product.name }}</td>
                                    <td>${{ product.price.toFixed(2) }}</td>
                                    <td>{{ product.stock }}</td>
                                    <td><button @click="removeProduct(product.id)" class="btn btn-sm btn-danger">Delete</button></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script>
        Vue.createApp({
            data() {
                return {
                    newProduct: { name: '', price: 0, stock: 0 },
                    products: [
                        { id: 1, name: 'Laptop', price: 999.99, stock: 15 },
                        { id: 2, name: 'Wireless Mouse', price: 25.50, stock: 120 },
                        { id: 3, name: 'Mechanical Keyboard', price: 85.00, stock: 45 }
                    ]
                }
            },
            methods: {
                addProduct() {
                    const newId = this.products.length > 0 ? Math.max(...this.products.map(p => p.id)) + 1 : 1;
                    this.products.push({ id: newId, ...this.newProduct });
                    this.newProduct = { name: '', price: 0, stock: 0 }; // Reset form
                },
                removeProduct(id) {
                    this.products = this.products.filter(p => p.id !== id);
                }
            }
        }).mount('#app');
    </script>
</body>
</html>
