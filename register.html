<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vue App - Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div id="app">
        <!-- Consistent Navbar -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
            <div class="container-fluid">
                <a class="navbar-brand fw-bold" href="index.html">VueApp</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="products.html">Products</a></li>
                        <li class="nav-item"><a class="nav-link" href="sales.html">Sales</a></li>
                        <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
                        <li class="nav-item"><a class="nav-link active" href="register.html">Register</a></li>
                    </ul>
                </div>
            </div>
        </nav>

        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <!-- Registration Form -->
                    <div class="card shadow-sm mb-4">
                        <div class="card-body">
                            <h4 class="card-title text-center mb-4">Create Account</h4>
                            <form @submit.prevent="handleRegister">
                                <div class="mb-3">
                                    <label class="form-label">Full Name</label>
                                    <input type="text" v-model="user.name" class="form-control" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Email address</label>
                                    <input type="email" v-model="user.email" class="form-control" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Password</label>
                                    <input type="password" v-model="user.password" class="form-control" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Role</label>
                                    <select v-model="user.role" class="form-select" required>
                                        <option value="" disabled>Select Role</option>
                                        <option value="admin">Administrator</option>
                                        <option value="manager">Store Manager</option>
                                        <option value="cashier">Cashier</option>
                                    </select>
                                </div>
                                <div class="d-grid">
                                    <button type="submit" class="btn btn-success">Register</button>
                                </div>
                                <p class="text-center mt-3 mb-0">Already have an account? <a href="login.html">Login here</a></p>
                            </form>
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <!-- Relevant Table: User Roles -->
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <h5 class="card-title">Available Roles & Permissions</h5>
                            <div class="table-responsive">
                                <table class="table table-sm table-bordered">
                                    <thead class="table-light">
                                        <tr>
                                            <th>Role</th>
                                            <th>Can Edit Products?</th>
                                            <th>Can View Sales?</th>
                                            <th>Can Manage Users?</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr>
                                            <td>Administrator</td>
                                            <td class="text-success">Yes</td>
                                            <td class="text-success">Yes</td>
                                            <td class="text-success">Yes</td>
                                        </tr>
                                        <tr>
                                            <td>Store Manager</td>
                                            <td class="text-success">Yes</td>
                                            <td class="text-success">Yes</td>
                                            <td class="text-danger">No</td>
                                        </tr>
                                        <tr>
                                            <td>Cashier</td>
                                            <td class="text-danger">No</td>
                                            <td class="text-success">Yes</td>
                                            <td class="text-danger">No</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script>
        Vue.createApp({
            data() {
                return {
                    user: { name: '', email: '', password: '', role: '' }
                }
            },
            methods: {
                handleRegister() {
                    alert(`Registering ${this.user.name} as ${this.user.role}...`);
                    // In a real app, this would trigger an API call
                }
            }
        }).mount('#app');
    </script>
</body>
</html>
